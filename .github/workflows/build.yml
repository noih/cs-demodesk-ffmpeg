name: Build FFmpeg
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
permissions:
  contents: read
concurrency:
  group: ffmpeg-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      builder: ${{ steps.upstream.outputs.builder }}
      ffmpeg: ${{ steps.upstream.outputs.ffmpeg }}
      tag: ${{ steps.upstream.outputs.tag }}
      changed: ${{ steps.upstream.outputs.changed }}
      upstream: ${{ steps.upstream.outputs.upstream }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 scripts/test_check_release.py
          python3 scripts/check-release.py
  reserve-tag:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reserve tag before the long build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Tag while this revision is current; publishing an older workflow can require extra permissions.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' > tag-sha.txt 2> tag-error.txt; then
            test "$(cat tag-sha.txt)" = "$GITHUB_SHA" || { echo 'Release tag points to a different commit'; exit 1; }
          elif grep -q '(HTTP 404)' tag-error.txt; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          else
            cat tag-error.txt >&2
            exit 1
          fi
  build:
    needs: [check, reserve-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ffmpeg-win64-v1-${{ needs.check.outputs.builder }}-${{ hashFiles('scripts/build.sh', 'scripts/minimal.sh') }}
          restore-keys: |
            ffmpeg-win64-v1-${{ needs.check.outputs.builder }}-
            ffmpeg-win64-v1-
      - name: Build minimal Windows package
        env:
          BUILDER_REV: ${{ needs.check.outputs.builder }}
          FFMPEG_REV: ${{ needs.check.outputs.ffmpeg }}
        run: bash scripts/build.sh "$BUILDER_REV" "$FFMPEG_REV"
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: dist/*
          if-no-files-found: error
          compression-level: 0
  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: dist
      - name: Test Windows binaries
        shell: pwsh
        run: |
          Expand-Archive dist/cs-demodesk-ffmpeg-win64-gpl-shared.zip package
          ./scripts/smoke.ps1 -Bin package/bin
  release:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: dist
      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          UPSTREAM_TAG: ${{ needs.check.outputs.upstream }}
          FFMPEG_VERSION: ${{ needs.check.outputs.version }}
          FFMPEG_REV: ${{ needs.check.outputs.ffmpeg }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          {
            printf 'FFmpeg version: **%s**\n\n' "$FFMPEG_VERSION"
            printf 'BtbN source release: [%s](https://github.com/BtbN/FFmpeg-Builds/releases/tag/%s)\n\n' "$UPSTREAM_TAG" "$UPSTREAM_TAG"
            printf 'FFmpeg source: [%s](https://github.com/FFmpeg/FFmpeg/commit/%s)\n\n' "$FFMPEG_REV" "$FFMPEG_REV"
            printf '%s\n' 'Minimal Windows x64 FFmpeg for CS DemoDesk.' 'CPU smoke tests passed. NVIDIA hardware validation is separate.' 'Sources, licenses and build provenance are included in the attached archives.'
          } > notes.md
          gh release create "$RELEASE_TAG" *.zip *.tar.xz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG" --notes-file notes.md --latest
